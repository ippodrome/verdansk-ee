<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verdansk Easter Eggs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b10;
    --card: #121922;
    --card2: #182230;
    --line: #243140;
    --text: #e7eef6;
    --muted: #8ea0b5;
    --accent: #4aa3ff;
    --done: #3dcc8a;
    --gold: #e2b657;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Barlow, -apple-system, sans-serif;
    background:
      radial-gradient(900px 420px at 10% -10%, #16324f 0%, transparent 55%),
      radial-gradient(700px 380px at 100% 0%, #1a2a1c 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    padding: 22px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .kicker {
    letter-spacing: .22em; font-size: 11px; color: var(--accent); font-weight: 600;
  }
  h1 {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 40px; line-height: .9; margin: 6px 0 8px; letter-spacing: .02em;
  }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .hero {
    display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center;
    background: linear-gradient(180deg, #182433, #101820);
    border: 1px solid var(--line); border-radius: 18px; padding: 14px;
    box-shadow: 0 16px 40px #0006;
  }
  .ring { width: 92px; height: 92px; }
  .stats { display: flex; justify-content: space-between; align-items: end; gap: 8px; }
  .count { font-family: "Barlow Condensed", sans-serif; font-size: 34px; line-height: 1; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
    background: #1d3148; color: var(--accent);
  }
  .badge.ok { background: #143526; color: var(--done); }
  .badge.gold { background: #3a3018; color: var(--gold); }
  .track { margin-top: 10px; height: 8px; border-radius: 999px; background: #0c1218; overflow: hidden; }
  .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--done)); }
  .marks { display: flex; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .marks b { color: var(--text); font-weight: 600; }
  .row { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  button {
    background: #121a24; color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; font: 600 13px Barlow, sans-serif;
  }
  button.active { background: #17304a; border-color: #3d78b8; color: #d7ebff; }
  button.primary { margin-left: auto; background: #17304a; border-color: #3d78b8; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  li.done { background: #101a16; }
  li.done .name { color: #9eb8aa; text-decoration: line-through; }
  .head { display: flex; gap: 12px; align-items: center; padding: 12px 12px 12px 14px; }
  .num {
    width: 28px; color: var(--muted); font-family: "Barlow Condensed", sans-serif;
    font-size: 18px; flex: none;
  }
  input { width: 22px; height: 22px; accent-color: var(--done); flex: none; }
  .name { font-weight: 600; font-size: 16px; }
  .where {
    display: inline-block; margin-top: 3px; font-size: 12px; color: #c9d7ea;
    background: #243246; border-radius: 999px; padding: 2px 8px;
  }
  li.done .where { background: #1c3328; color: #b7d8c6; }
  .toggle {
    margin-left: auto; width: 32px; height: 32px; border-radius: 10px; padding: 0; color: var(--muted);
  }
  .more {
    display: none; padding: 0 14px 14px 76px; color: #c5d3e2; font-size: 14px; line-height: 1.45;
  }
  li.open .more { display: block; }
  li.open .toggle { transform: rotate(90deg); }
  #toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: #123224; color: var(--done); border: 1px solid #1f6b45;
    padding: 10px 14px; border-radius: 12px; font-size: 13px; display: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">WARZONE · VERDANSK</div>
    <h1>EASTER EGGS</h1>
    <div class="sub">Police computer list. Tap a row for the step.</div>
    <div class="hero">
      <svg class="ring" viewBox="0 0 92 92" id="ring"></svg>
      <div>
        <div class="stats">
          <div class="count" id="count">0/30</div>
          <span class="badge" id="reward">Need 15</span>
        </div>
        <div class="track"><div class="bar" id="bar"></div></div>
        <div class="marks"><span>15 <b>care package</b></span><span>30 <b>extra cash</b></span></div>
      </div>
    </div>
    <div class="row">
      <button class="active" data-f="all">All</button>
      <button data-f="open">Open</button>
      <button data-f="done">Done</button>
      <button class="primary" id="share">Copy link</button>
      <button id="reset">Reset</button>
    </div>
    <ul id="list"></ul>
  </div>
  <div id="toast">Link copied</div>
<script>
const items = [
  ["Destruction of Verdansk", "Stadium", "Note by the unexploded nuke on the ground outside Stadium."],
  ["Secrets of the Pacific", "Prison", "Gulag showers under Prison. Interact with the ping pong paddle on the bench."],
  ["Roze Was Here", "Lozoff Pass", "Stairwell in the Lozoff Pass building, upper floors. Interact with the graffiti."],
  ["Scarlet Entrance", "Quarry", "Red door building in Quarry, up the stairs. Read the note beside the sealed red door. Shovel for Press F often spawns here."],
  ["Hunt For Adler", "Hospital", "Side window, through the door, turn right. Note on the bed next to Stitch's phone."],
  ["Heads Up!", "Boneyard", "Crashed loadout crate with a body under it. Read the note. Blue SMG usually spawns here."],
  ["Zom-Beached", "Coast, shipwreck", "Zombie shipwreck on the beach. Read the note on the wreck."],
  ["5th Anniversary Exhibition", "Train Station", "East of Train Station. Up the stairs, then left. Read the note."],
  ["Vintage Wine", "Dam", "Far northwest, west of Dam. House next to the police station. Twist the bottle, then read the note."],
  ["Stored Secrets", "Storage Town", "Open the secret locked storage unit and interact with the intel inside."],
  ["Bank Vault", "Bank", "Biometric scanner drops a Hardware Gift Card. Buy the Bit Drill, place it on the vault door, loot the cash."],
  ["Press F", "Graveyard", "Shovel at the Quarry red door, or near the bottom of Stadium. Dig the marked grave."],
  ["Try Your Luck", "Promenade", "Sea Token on a boat near the wreck, behind Prison, or the south coast. Deposit it in the gas station machine."],
  ["Unhinged Behavior", "Prison", "Floating-doors paper in a random cell. Shoot the sky doors behind Prison, smallest circle to largest."],
  ["Next Stop", "Airport", "Airport subway station. Interact with the Next Stop intel."],
  ["Prison Shed", "Prison", "Shed keypad. Code 13584927."],
  ["TV Station Shed", "TV Station", "Shed keypad. Code 01859472."],
  ["Farmland Secret Room", "Farmland", "Locked room keypad. Code 36158294."],
  ["Bunker 0", "Hills", "Coast south of Hills. Code 01011000."],
  ["Bunker 1", "Boneyard", "Mountains by Boneyard. Code 04222021."],
  ["Bunker 2", "Boneyard", "Northeast of Boneyard. Blue access card."],
  ["Bunker 3", "Storage Town", "West of Storage Town. Code 30198805."],
  ["Bunker 4", "Dam", "Red access card."],
  ["Bunker 5", "Military Base", "South of Military Base. Red access card."],
  ["Bunker 6", "Quarry", "East of Quarry. Red access card."],
  ["Bunker 7", "Stadium", "Northwest of Stadium. Blue access card."],
  ["Bunker 8", "Stadium", "Northwest of Stadium, TV Station side. Blue access card."],
  ["Bunker 9", "Prison", "Red access card."],
  ["Bunker 10", "Park", "South of the park. Code 31547206."],
  ["Ringtones", "Military Base", "Bunker 11, north of Military Base. Subtitles on. Phone reads 3 Russian numbers. Hit those phones, then the bunker keypad."]
];
const KEY = "verdansk-ee-v2";
let done = [];
let filter = "all";
let open = new Set();
function fromHash() {
  const h = location.hash.replace("#", "");
  if (!h) return null;
  try {
    const raw = atob(h.replace(/-/g, "+").replace(/_/g, "/"));
    return raw.split(",").filter(Boolean).map(Number);
  } catch { return null; }
}
const PUBLIC = "https://htmlpreview.github.io/?https://raw.githubusercontent.com/ippodrome/verdansk-ee/main/index.html";
function toHash() {
  const raw = btoa(done.slice().sort((a, b) => a - b).join(",")).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const hosted = location.protocol === "http:" || location.protocol === "https:";
  return (hosted ? location.origin + location.pathname : PUBLIC) + "#" + raw;
}
const hashed = fromHash();
done = hashed || JSON.parse(localStorage.getItem(KEY) || "[]");
function save() { localStorage.setItem(KEY, JSON.stringify(done)); history.replaceState(null, "", toHash()); }
const list = document.getElementById("list");
function ring(n) {
  const p = n / 30, c = 2 * Math.PI * 36, d = c * (1 - p);
  document.getElementById("ring").innerHTML = `<circle cx="46" cy="46" r="36" fill="none" stroke="#0c1218" stroke-width="8"/><circle cx="46" cy="46" r="36" fill="none" stroke="${n>=30?'#e2b657':n>=15?'#3dcc8a':'#4aa3ff'}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${d}" transform="rotate(-90 46 46)"/><text x="46" y="51" text-anchor="middle" fill="#e7eef6" font-size="18" font-family="Barlow Condensed, sans-serif">${n}</text>`;
}
function render() {
  list.innerHTML = "";
  items.forEach((it, i) => {
    const on = done.includes(i);
    if (filter === "open" && on) return;
    if (filter === "done" && !on) return;
    const li = document.createElement("li");
    if (on) li.classList.add("done");
    if (open.has(i)) li.classList.add("open");
    li.innerHTML = `<div class="head"><span class="num">${i + 1}</span><input type="checkbox" ${on ? "checked" : ""}><div><div class="name"></div><div class="where"></div></div><button class="toggle" aria-label="Details">›</button></div><div class="more"></div>`;
    li.querySelector(".name").textContent = it[0];
    li.querySelector(".where").textContent = it[1];
    li.querySelector(".more").textContent = it[2];
    li.querySelector("input").addEventListener("change", e => {
      e.stopPropagation();
      if (e.target.checked) { if (!done.includes(i)) done.push(i); }
      else done = done.filter(n => n !== i);
      save(); render();
    });
    li.querySelector(".toggle").onclick = e => { e.stopPropagation(); open.has(i) ? open.delete(i) : open.add(i); render(); };
    li.querySelector(".head").onclick = ev => { if (ev.target.tagName === "INPUT") return; open.has(i) ? open.delete(i) : open.add(i); render(); };
    list.appendChild(li);
  });
  const n = done.length;
  document.getElementById("count").textContent = n + "/30";
  document.getElementById("bar").style.width = (n / 30 * 100) + "%";
  ring(n);
  const badge = document.getElementById("reward");
  if (n >= 30) { badge.textContent = "Extra cash"; badge.className = "badge gold"; }
  else if (n >= 15) { badge.textContent = "Care package"; badge.className = "badge ok"; }
  else { badge.textContent = (15 - n) + " to package"; badge.className = "badge"; }
}
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("active", x === b));
  render();
});
document.getElementById("share").onclick = async () => {
  const url = toHash();
  try { await navigator.clipboard.writeText(url); } catch { prompt("Copy link", url); }
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 1400);
};
document.getElementById("reset").onclick = () => {
  if (confirm("Clear all marks?")) { done = []; open.clear(); save(); render(); }
};
save();
render();
</script>
</body>
</html>
